services:
  db:
    image: mysql:8.0
    container_name: sena-inventario-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-sena_inventario_dev}
      MYSQL_USER: ${DB_USER:-sena_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sena_pass}
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: sena-inventario-api
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-4000}
      DATABASE_URL: mysql://${DB_USER:-sena_user}:${DB_PASSWORD:-sena_pass}@db:3306/${DB_NAME:-sena_inventario_dev}
      MIGRATE_DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD:-root}@db:3306/${DB_NAME:-sena_inventario_dev}
      DATABASE_URL_TEST: mysql://root:${DB_ROOT_PASSWORD:-root}@db:3306/sena_inventario_test
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_cambiar_en_produccion}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_cambiar}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - ./server:/app
      - /app/node_modules
    command: >
      sh -c "
        npm install &&
        npx prisma generate &&
        export DATABASE_URL=$$MIGRATE_DATABASE_URL &&
        npx prisma migrate deploy &&
        npx prisma db seed &&
        export DATABASE_URL=$$DATABASE_URL &&
        npm run dev
      "

  client:
    container_name: sena-inventario-client
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - '${CLIENT_PORT:-5173}:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host

  adminer:
    container_name: sena-inventario-adminer
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${ADMINER_PORT:-8080}:8080'

volumes:
  mysql-data:
